name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate release tag matches package version
        shell: bash
        run: |
          node scripts/check-product-version.mjs "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix desktop/frontend-spartan ci
      - name: Verify release quality gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm --prefix desktop/frontend-spartan run test:electron
          npm --prefix desktop/frontend-spartan run i18n:check
      - name: Build without publishing
        run: npm run build
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
            release/*/*.AppImage
            release/*/*.yml
            release/*/*.blockmap

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-input
      - name: Validate installers and merge macOS updater metadata
        run: node scripts/prepare-release-assets.mjs release-input release-output "$(node -p 'require("./package.json").version')"
      - run: npm --prefix desktop/frontend-spartan ci
      - run: npm --prefix landing ci
      - name: Validate and build landing
        run: |
          npm --prefix landing run docs:check
          npm --prefix landing run build:gh
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Sparta Agent ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: release-output/*
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./landing/dist
          force_orphan: true
