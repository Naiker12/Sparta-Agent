name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  build:
    # electron-builder writes one latest-mac.yml for both macOS architectures.
    # Serializing the matrix prevents concurrent uploads from overwriting it.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x64
          - os: ubuntu-latest
            platform: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$TAG_VERSION" = "$VERSION" || {
            echo "Tag v$TAG_VERSION does not match package version v$VERSION"
            exit 1
          }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Rust toolchain for sparta-security NAPI build
      # Install JS deps (triggers prebuild → rust:napi automatically)
      - run: npm ci

      - name: Install desktop frontend dependencies
        run: npm --prefix desktop/frontend-spartan ci

      # Build: tsc → vite build → electron-builder
      - name: Verify release quality gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm --prefix desktop/frontend-spartan run test:electron
          npm --prefix desktop/frontend-spartan run i18n:check

      # Do not expose empty signing secrets as environment variables:
      # electron-builder resolves an empty CSC_LINK to the checkout directory
      # and fails with "not a file" instead of producing an unsigned build.
      - name: Configure Windows signing credentials
        if: runner.os == 'Windows'
        shell: bash
        env:
          SIGNING_LINK: ${{ secrets.WIN_CSC_LINK }}
          SIGNING_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_LINK" ]; then
            echo "WIN_CSC_LINK=$SIGNING_LINK" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Configure macOS signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGNING_LINK: ${{ secrets.MAC_CSC_LINK }}
          SIGNING_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_LINK" ]; then
            echo "CSC_LINK=$SIGNING_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          fi

      - run: npm run build
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing material lives exclusively in GitHub Actions secrets.
          # WIN_CSC_* is used by the Windows job; CSC_* by macOS.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Set this repository variable to true once certificates are in place.
          REQUIRE_CODE_SIGNING: ${{ vars.REQUIRE_CODE_SIGNING }}

      # Publish artifacts to GitHub Release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
            release/*/*.AppImage
            release/*/*.yml
            release/*/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
