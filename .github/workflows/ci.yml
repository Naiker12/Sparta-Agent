name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install desktop frontend dependencies
        run: npm --prefix desktop/frontend-spartan ci || npm --prefix desktop/frontend-spartan install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Electron frontend regression tests
        run: npm --prefix desktop/frontend-spartan run test:electron

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install desktop frontend dependencies
        run: npm --prefix desktop/frontend-spartan ci || npm --prefix desktop/frontend-spartan install

      - name: Unit tests
        run: npm test
