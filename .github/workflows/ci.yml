name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install desktop frontend dependencies
        run: npm --prefix desktop/frontend-spartan ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Electron frontend regression tests
        run: npm --prefix desktop/frontend-spartan run test:electron

      - name: Desktop frontend unit and channel tests
        run: npm --prefix desktop/frontend-spartan test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install desktop frontend dependencies
        run: npm --prefix desktop/frontend-spartan ci

      - name: Install browser for UI regression tests
        # The UI regressions mount React in a real browser.
        run: npx playwright install --with-deps chromium

      - name: Unit and browser regression tests
        run: npm test

  backend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: pip install pytest fastapi==0.141.1 PyJWT httpx structlog cryptography python-multipart pymupdf openpyxl python-docx PyYAML numpy Pillow filelock ddgs
      - name: Authentication boundary and credential rotation
        working-directory: desktop/backend-spartan
        env:
          PYTHONPATH: .
        run: python -m pytest --noconftest tests/test_auth_access_boundary.py tests/test_credential_rotation_race.py tests/test_api_only_contract.py -q
      - name: Channel security and integration contract
        working-directory: desktop/backend-spartan
        env:
          PYTHONPATH: .
        run: python -m pytest --noconftest tests/test_channels.py tests/test_channels_controls.py tests/test_channels_date.py tests/test_channels_documents.py tests/test_channels_images.py tests/test_channels_intents.py tests/test_channels_permissions_command.py tests/test_channels_personal_pairing.py tests/test_channels_profile.py tests/test_channels_profile_capability.py tests/test_channels_project_context.py tests/test_channels_projects.py tests/test_channels_voice.py tests/test_telegram_delivery_errors.py -q
      - name: Document generation and unique workspace folders
        working-directory: desktop/backend-spartan
        env:
          PYTHONPATH: .
        run: python -m pytest --noconftest tests/test_document_generation.py tests/test_project_folder_uniqueness.py -q
